<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual drawing of the LG home lab</title>
  <desc id="desc">An owner-controlled television with a community home screen, protected SSH access from a computer, and a route back to the original LG Home. This is an illustrative system diagram, not a screenshot or a network inventory.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#7C9273" stroke-opacity=".12"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V7" stroke="#9FB293" stroke-width="1" stroke-opacity=".3"/>
    </pattern>
    <linearGradient id="glass" x1="222" y1="269" x2="632" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D5141"/><stop offset="1" stop-color="#17372D"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1 1L5 3.5L1 6" stroke="#587350" stroke-width="1.2" fill="none"/>
    </marker>
  </defs>
  <g class="lab-layer lab-layer-grid">
    <rect x="20" y="20" width="800" height="634" fill="url(#grid)"/>
    <path d="M20 61V20H61M779 20H820V61M20 613V654H61M779 654H820V613" stroke="#A4B29A" stroke-width="1"/>
  </g>
  <g font-family="Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.7" fill="#5A6D52">
    <text x="42" y="48">SYSTEM STUDY / 01</text>
    <text x="798" y="48" text-anchor="end">CONCEPTUAL DIAGRAM</text>
  </g>
  <path d="M43 74H797" stroke="#B7C4AD"/>

  <!-- A computer is the temporary maintenance route; no address is exposed. -->
  <g class="lab-layer lab-layer-nodes">
  <g transform="translate(52 105)">
    <rect x="0" y="0" width="254" height="118" fill="#F3F1E9" stroke="#A9B9A0"/>
    <rect x="18" y="21" width="60" height="42" rx="2" stroke="#335740" stroke-width="1.5"/>
    <path d="M12 69H84L79 74H17L12 69Z" stroke="#335740" stroke-width="1.5"/>
    <path d="M29 35L35 40L29 45M42 46H52" stroke="#6A865E" stroke-width="1.4"/>
    <text x="98" y="39" fill="#18392B" font-family="Arial, sans-serif" font-size="16" font-weight="600">Maintenance</text>
    <text x="98" y="62" fill="#5D7153" font-family="Consolas, monospace" font-size="10" letter-spacing=".9">KEY-BASED SSH</text>
    <path d="M18 89H236" stroke="#C7D0BF"/>
    <text x="18" y="105" fill="#617158" font-family="Consolas, monospace" font-size="9" letter-spacing=".4">CONTROLLED ADMINISTRATOR ACCESS</text>
  </g>

  <g transform="translate(534 105)">
    <rect x="0" y="0" width="254" height="118" fill="#F3F1E9" stroke="#A9B9A0"/>
    <path d="M29 43L47 27L65 43V64H52V50H42V64H29V43Z" stroke="#335740" stroke-width="1.5"/>
    <path d="M20 42L47 19L74 42" stroke="#335740" stroke-width="1.5"/>
    <text x="96" y="39" fill="#18392B" font-family="Arial, sans-serif" font-size="16" font-weight="600">Stock fallback</text>
    <text x="96" y="62" fill="#5D7153" font-family="Consolas, monospace" font-size="10" letter-spacing=".9">ORIGINAL LG HOME</text>
    <path d="M18 89H236" stroke="#C7D0BF"/>
    <text x="18" y="105" fill="#617158" font-family="Consolas, monospace" font-size="9" letter-spacing=".4">A TESTED ROUTE BACK</text>
  </g>

  <circle cx="179" cy="223" r="3" fill="#F3F1E9" stroke="#587350"/>
  <circle cx="661" cy="223" r="3" fill="#F3F1E9" stroke="#587350"/>
  </g>

  <!-- Fine connection lines form a readable topology around the hardware. -->
  <path class="lab-link-maintenance" d="M179 223V251H270V276" stroke="#587350" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path class="lab-link-recovery" d="M661 223V251H570V276" stroke="#587350" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <path d="M127 286H105V530H127M713 286H735V530H713" stroke="#BBC7B1"/>
  <g font-family="Consolas, monospace" font-size="9" letter-spacing="1.1" fill="#77876D">
    <text x="91" y="414" text-anchor="middle" transform="rotate(-90 91 414)">OWNER-CONTROLLED HARDWARE</text>
    <text x="749" y="414" text-anchor="middle" transform="rotate(90 749 414)">LOCAL LAB ENVIRONMENT</text>
  </g>

  <!-- The screen is an original abstraction, explicitly not a product screenshot. -->
  <g class="lab-layer lab-layer-tv">
  <rect x="135" y="279" width="570" height="265" rx="8" fill="#142B21"/>
  <rect x="143" y="287" width="554" height="247" rx="3" fill="url(#glass)" stroke="#54704A" stroke-width=".8"/>
  <path d="M143 460L344 287H536L249 534H143V460Z" fill="#719167" fill-opacity=".06"/>
  <path d="M143 490L382 287" stroke="#B6CCA9" stroke-opacity=".06"/>
  <text x="170" y="319" fill="#A6BE99" font-family="Consolas, monospace" font-size="9" letter-spacing="1.2">GLASSHOUSE / COMMUNITY HOME</text>
  <circle cx="668" cy="315" r="3.5" fill="#A4BD92"/>
  <path d="M171 337H669" stroke="#8AA27C" stroke-opacity=".3"/>
  <text x="170" y="381" fill="#E8EDDF" font-family="Arial, sans-serif" font-size="30" letter-spacing="-1.2">A more considered home.</text>
  <text x="171" y="404" fill="#A6BD9C" font-family="Consolas, monospace" font-size="9" letter-spacing=".65">COMMUNITY TOOLS. DOCUMENTED CHANGES.</text>
  <g transform="translate(171 436)">
    <rect width="111" height="68" rx="2" fill="#D1DBC2"/>
    <rect x="122" width="111" height="68" rx="2" fill="#6C8460" fill-opacity=".55" stroke="#9BB28C" stroke-opacity=".3"/>
    <rect x="244" width="111" height="68" rx="2" fill="#6C8460" fill-opacity=".25" stroke="#9BB28C" stroke-opacity=".3"/>
    <rect x="366" width="132" height="68" rx="2" fill="url(#hatch)" stroke="#9BB28C" stroke-opacity=".3"/>
    <path d="M44 23H67M42 26L36 41C35 45 39 48 43 44L49 38H62L68 44C72 48 76 45 75 41L69 26" stroke="#2F513B" stroke-width="1.5"/>
    <path d="M43 31V37M40 34H46" stroke="#2F513B" stroke-width="1.5"/>
    <circle cx="65" cy="32" r="1.3" fill="#2F513B"/><circle cx="68" cy="36" r="1.3" fill="#2F513B"/>
    <path d="M169 23L187 34L169 45V23Z" stroke="#C5D4B6" stroke-width="1.5"/>
    <rect x="287" y="23" width="24" height="22" rx="2" stroke="#B2C5A1" stroke-width="1.5"/>
    <path d="M294 18V27M304 18V27M294 41V50M304 41V50M282 30H291M282 38H291M307 30H316M307 38H316" stroke="#B2C5A1" stroke-width="1.3"/>
    <path d="M425 34H439M432 27V41" stroke="#90AA7F" stroke-width="1.4"/>
  </g>
  <circle cx="420" cy="539" r="1.4" fill="#92A782"/>
  <path d="M266 544L244 566H278L293 544M547 544L562 566H596L574 544" fill="#223D2D"/>
  <path d="M205 567H635" stroke="#A6B59B"/>
  <path d="M420 568V594" stroke="#879C79"/>
  <circle cx="420" cy="594" r="3" fill="#F3F1E9" stroke="#879C79"/>
  </g>

  <g font-family="Consolas, monospace" fill="#4F6846" font-size="10" letter-spacing=".8">
    <text x="420" y="619" text-anchor="middle">HOME SCREEN · RESTART CHECKS · RECOVERY</text>
  </g>
  <path d="M43 641H797" stroke="#B7C4AD"/>
  <g font-family="Consolas, monospace" font-size="9" letter-spacing=".7" fill="#73846A">
    <text x="43" y="674">FIG. 01 — ILLUSTRATIVE SYSTEM VIEW</text>
    <text x="797" y="674" text-anchor="end">NOT A SCREENSHOT</text>
  </g>
</svg>
